# Compila el APK de MANUAL IA (básica) cada vez que subes cambios a "main".
# El APK queda en la pestaña "Releases" (y en Actions → la ejecución → Artifacts).
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk
  cancel-in-progress: true

jobs:
  apk:
    name: APK básica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar proyecto (carpeta android, permisos, ícono)
        run: bash preparar.sh

      - name: Compilar APK
        run: flutter build apk --release

      - name: Copiar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk manual_ia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: manual_ia-apk
          path: manual_ia.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MANUAL IA básica · compilación ${{ github.run_number }}
          body: APK generado automáticamente (manual_ia.apk).
          files: manual_ia.apk
